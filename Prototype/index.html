<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), icon=name=>`<svg class="icon" aria-hidden="true"><use href="#${name}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='headly.prototype.records.v1';let records=[],locked=false,loadError='',tab='today',month=monthStart(new Date()),selectedDay=null,modal=null,draft=null,original=null,editingExisting=false,expanded=false,error='',confirmation=null,focusBefore=null,toastTimer;
const clone=x=>JSON.parse(JSON.stringify(x)),dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1)}function dayStart(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}function monthEnd(d){return new Date(d.getFullYear(),d.getMonth()+1,1)}
const fmtDate=d=>new Date(d).toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}),fmtTime=d=>new Date(d).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),fmtFull=d=>new Date(d).toLocaleString('zh-CN',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
function localDate(d){return dayKey(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function duration(r){let min=Math.max(1,Math.floor(((r.endedAt?new Date(r.endedAt):new Date())-new Date(r.startedAt))/60000));return min<60?`${min} 分钟`:`${Math.floor(min/60)} 小时${min%60?` ${min%60} 分`:''}`}
const label=n=>n<=3?'轻度':n<=6?'中度':'重度',color=n=>n<=3?'var(--forest)':n<=6?'var(--amber)':'var(--rose)',ongoing=()=>records.find(r=>!r.endedAt),title=r=>r.location==='未选择'?'头痛记录':r.location+'头痛';
function overlaps(r,start,end,now=new Date()){return new Date(r.startedAt)<end&&new Date(r.endedAt||now)>start}
function forDay(d,source=records,now=new Date()){return source.filter(r=>overlaps(r,dayStart(d),addDays(d,1),now))}
function statistics(m){
  const now=new Date(),end=monthEnd(m),included=records.filter(r=>overlaps(r,m,end,now)),completed=included.filter(r=>r.endedAt);

  for(let d=new Date(m);d<end&&d<now;d=addDays(d,1))if(forDay(d,included,now).length)days++;

}
function validateFile(file){if(file.schemaVersion!==1||!Array.isArray(file.records))throw Error('版本不兼容');let ids=new Set();for(const r of file.records){if(typeof r.id!=='string'||ids.has(r.id)||!Number.isInteger(r.intensity)||r.intensity<1||r.intensity>10||!Number.isFinite(Date.parse(r.startedAt))||(r.endedAt&&(!Number.isFinite(Date.parse(r.endedAt))||new Date(r.endedAt)<=new Date(r.startedAt)))||!['symptoms','factors','relief'].every(x=>Array.isArray(r[x])&&r[x].every(v=>typeof v==='string'))||!['location','medication','notes'].every(x=>typeof r[x]==='string'))throw Error('数据损坏');ids.add(r.id)}if(file.records.filter(r=>!r.endedAt).length>1)throw Error('进行中数据异常');return file.records}
try{records=readRecords(localStorage.getItem(KEY))}catch(e){locked=true;loadError='本地记录暂时无法读取。原数据已保留，目前不会覆盖，请勿清除浏览器数据。'}
function readRecords(value){return(value?validateFile(JSON.parse(value)):[]).sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))}
function refreshRecords(){
  if(locked)throw Error('记录暂时无法读取，已停止写入以保护原数据。');
  try{records=readRecords(localStorage.getItem(KEY))}catch(e){locked=true;loadError='本地记录暂时无法读取，原数据已保留。';throw Error(loadError)}
}
function requireUnchanged(expected){
  const current=records.find(r=>r.id===expected?.id);
  if(!current||JSON.stringify(current)!==JSON.stringify(expected))throw Error('这条记录已在其他窗口修改或删除。请关闭后重新打开，你的当前输入仍保留。');
  return current;
}
function persist(next){if(locked)throw Error('记录暂时无法读取，已停止写入以保护原数据。');let value=JSON.stringify({schemaVersion:1,records:next});try{localStorage.setItem(KEY,value)}catch(e){throw Error('保存失败，浏览器存储不可用或空间不足。你的输入已保留，请重试。')}records=next.slice().sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))}
function toast(text){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast">${esc(text)}</div>`;toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',2300)}
function row(r){return`<button class="record-row" data-action="detail" data-id="${esc(r.id)}" aria-label="${esc(title(r))}，强度 ${r.intensity}，${r.endedAt?'已结束':'进行中'}"><span class="pain-badge ${r.intensity>6?'strong':r.intensity>3?'medium':''}">${r.intensity}</span><span class="record-content"><span class="record-title">${esc(title(r))}</span><span class="record-meta" style="display:block">${fmtDate(r.startedAt)} ${fmtTime(r.startedAt)} · ${r.endedAt?duration(r):'进行中'}</span></span>${icon('right')}</button>`}
function orbit(){return`<svg class="orbit" viewBox="0 0 174 154" aria-hidden="true">${Array.from({length:10},(_,i)=>`<ellipse cx="87" cy="77" rx="${84-i*6}" ry="${66-i*4}" fill="none" stroke="#c7d9ba" stroke-opacity="${.18+i*.035}" stroke-width=".7"/>`).join('')}</svg>`}
function render(){let sc=$('.scroll'),scrollTop=sc?.scrollTop||0;$('#app').innerHTML=`<header class="app-header"><i class="brand-mark" aria-hidden="true"></i><span class="wordmark">Headly</span><span class="brand-cn">轻记</span><button class="icon-button" aria-label="记录与隐私" data-action="settings">${icon('settings')}</button></header>${records.some(r=>r.isDemo)?'<div class="demo-label">正在浏览虚构演示记录</div>':''}<div class="scroll" id="main-scroll">${loadError?`<div class="field-error" role="alert">${loadError}</div>`:''}${tab==='today'?todayHTML():reviewHTML()}</div><nav class="nav" aria-label="主导航"><button class="nav-tab ${tab==='today'?'active':''}" data-action="today" aria-current="${tab==='today'?'page':'false'}">${icon('grid')}<span>今日</span></button><button class="nav-plus" aria-label="新建头痛记录" data-action="new">${icon('plus')}</button><button class="nav-tab ${tab==='review'?'active':''}" data-action="review" aria-current="${tab==='review'?'page':'false'}">${icon('chart')}<span>回顾</span></button></nav>`;$('#main-scroll').scrollTop=scrollTop;document.querySelectorAll('.scene').forEach(x=>x.classList.toggle('active',x.dataset.action===`scene-${modal==='editor'?'record':tab}`));renderOverlay()}
function todayHTML(){let stat=statistics(monthStart(new Date())),active=ongoing();return`<div class="page-heading"><p class="eyebrow">${new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</p><h1>今天，慢一点。</h1></div><section class="hero">${orbit()}<div class="hero-content"><div class="hero-label">${active?'头痛记录进行中':'为自己留一份记录'}</div>${active?`<div class="intensity-value" style="margin:12px 0 10px"><span class="intensity-number">${active.intensity}</span><span class="number-unit" style="color:var(--sage)">/ 10</span></div><p>${esc(title(active))} · ${duration(active)}</p><button class="primary light" data-action="detail" data-id="${esc(active.id)}">${icon('check')}查看并结束这次头痛</button>`:`<h2>让每次不适，<br>都有迹可循。</h2><p>选一个强度，就能轻松记下。</p><button class="primary light" data-action="new">${icon('plus')}记录此刻的头痛</button>`}</div></section><section class="card"><div class="section-title"><h2>这一周</h2><span class="caption">有记录的日子</span></div><div class="week-grid">${Array.from({length:7},(_,i)=>{let d=addDays(new Date(),i-6),rs=forDay(d);return`<div class="week-day ${i===6?'today':''}" aria-label="${fmtDate(d)}，${rs.length?'有头痛记录':'未记录'}"><span class="weekday">${['日','一','二','三','四','五','六'][d.getDay()]}</span><span class="day-circle">${d.getDate()}</span><i class="dot ${rs.length?'filled':''}" ${rs.length?`style="background:${color(Math.max(...rs.map(r=>r.intensity)))}"`:''}></i></div>`}).join('')}</div></section><div class="metrics"><section class="card metric"><div class="metric-top"><span>本月记录日</span>${icon('calendar-icon')}</div><div class="number-row"><span class="number">${stat.days}</span><span class="number-unit">天</span></div></section><section class="card metric"><div class="metric-top"><span>平均强度</span>${icon('wave')}</div><div class="number-row"><span class="number">${stat.avg}</span><span class="number-unit">/ 10</span></div></section></div><section class="recent"><div class="section-title"><h2>最近记录</h2><button class="plain" data-action="review">查看全部</button></div>${records.length?`<div class="card record-list" style="margin-top:0">${row(records[0])}</div>`:`<div class="card" style="margin-top:0"><strong style="font-size:12px;font-weight:550">从一条记录开始</strong><p class="caption" style="margin:8px 0 0">不舒服时记一下，其他时间安心生活。</p></div>`}</section><div class="privacy-foot">${icon('lock')}无需登录，记录只留在这台设备。</div>`}
function reviewHTML(){let stat=statistics(month),offset=(month.getDay()+6)%7,days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),list=selectedDay?stat.included.filter(r=>overlaps(r,new Date(selectedDay+'T00:00:00'),addDays(new Date(selectedDay+'T00:00:00'),1))):stat.included;return`<div class="page-heading"><p class="eyebrow" style="letter-spacing:1.5px;font-size:9px">YOUR PERSONAL PATTERNS</p><h1>看见自己的节奏</h1></div><section class="card calendar-card"><div class="calendar-header"><strong>${month.getFullYear()} 年 ${month.getMonth()+1} 月</strong><div class="calendar-nav"><button class="icon-button" aria-label="上个月" data-action="prev-month">${icon('left')}</button><button class="icon-button" aria-label="下个月" data-action="next-month" ${month>=monthStart(new Date())?'disabled':''}>${icon('right')}</button></div></div><div class="calendar">${['一','二','三','四','五','六','日'].map(x=>`<span class="calendar-weekday">${x}</span>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{let d=addDays(month,i),rs=forDay(d),key=dayKey(d),future=d>new Date();return`<button class="calendar-day ${rs.length?'recorded':''} ${dayKey(new Date())===key?'current':''} ${selectedDay===key?'selected':''}" data-action="day" data-day="${key}" aria-label="${i+1} 日，${rs.length?'有头痛记录':'未记录'}" aria-pressed="${selectedDay===key}" ${future?'disabled':''}>${i+1}<i class="dot" style="background:${rs.length?color(Math.max(...rs.map(r=>r.intensity))):'transparent'}"></i></button>`}).join('')}</div><div class="legend"><i class="dot filled"></i><span>有头痛记录</span><span class="spacer"></span><span>空白日期为未记录</span></div></section><section class="card review-metrics">${[['记录日',stat.days,'天'],['平均强度',stat.avg,'/10'],['平均时长',stat.hours,'小时']].map(([a,b,c])=>`<div class="review-metric"><div class="caption">${a}</div><div class="number-row"><span class="number">${b}</span><span class="number-unit">${c}</span></div></div>`).join('')}</section><p class="review-caption">仅基于已记录数据；平均时长只统计已结束记录。</p><section class="recent"><div class="section-title"><h2>${selectedDay?`${new Date(selectedDay+'T00:00:00').getDate()} 日记录`:'本月记录'}</h2><span class="caption">${list.length} 条${selectedDay?' · <button class="plain" data-action="all-days" style="min-height:30px">全部</button>':''}</span></div>${list.length?`<div class="card record-list" style="margin-top:0">${list.map(row).join('')}</div>`:`<div class="card empty" style="margin-top:0">${icon('leaf')}<h3>这里还没有记录</h3><p>未记录的日子，不代表没有头痛。</p><button class="plain" data-action="backfill">补记一次头痛</button></div>`}</section>${stat.factors.length?`<section class="card"><div class="section-title"><h2>你提到的相关因素</h2><span class="caption">记录次数</span></div>${stat.factors.slice(0,3).map(([f,n])=>`<div class="factor-row"><span>${esc(f)}</span><span class="caption">${n} 次</span></div><div class="factor-bar" style="width:${n/stat.included.length*100}%"></div>`).join('')}<p class="review-caption" style="margin-top:14px">这些是你的主观记录，不代表因果关系。</p></section>`:''}`}
function openModal(type){focusBefore=document.activeElement;modal=type;render();setTimeout(()=>$('.modal .close')?.focus({preventScroll:true}),0)}
function newRecord(date=null){if(isDirty()){ask('放弃这次修改？','尚未保存的输入会被丢弃，然后新建记录。','放弃并新建',()=>{closeModal(true);newRecord(date)},'继续编辑',true);return}editingExisting=false;let start=new Date(),endedAt=null;if(date&&date!==dayKey(new Date())){start=new Date(date+'T12:00:00');endedAt=new Date(date+'T13:00:00').toISOString()}draft={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),startedAt:start.toISOString(),endedAt,intensity:0,location:'未选择',symptoms:[],factors:[],relief:[],medication:'',notes:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),isDemo:false};original=clone(draft);expanded=false;error='';openModal('editor')}
function editRecord(id){editingExisting=true;let r=records.find(r=>r.id===id);if(!r)return;draft=clone(r);original=clone(r);expanded=!!(r.symptoms.length||r.factors.length||r.relief.length||r.notes||r.medication);error='';modal='editor';render()}

function closeModal(force=false){if(!force&&isDirty()){ask('放弃这次修改？','尚未保存的输入会被丢弃。','放弃修改',()=>closeModal(true),'继续编辑',true);return}modal=null;draft=null;original=null;error='';render();focusBefore?.focus?.({preventScroll:true})}
function modalShell(heading,subtitle,body,footer=''){return`<div class="modal-layer"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading"><div class="drag-handle" aria-hidden="true"></div><header class="modal-header"><div><h2 class="modal-title" id="modal-heading">${heading}</h2><div class="modal-subtitle">${subtitle}</div></div><button class="close" aria-label="关闭浮层" data-action="close">${icon('close')}</button></header><div class="modal-scroll">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`}
function renderOverlay(){
  if(modal==='detail'&&!records.some(r=>r.id===draft?.id)){modal=null;draft=null}
  const oldScroll=$('.modal-scroll')?.scrollTop||0;
  $('#overlay-root').innerHTML=modal==='editor'?editorHTML():modal==='detail'?detailHTML():modal==='settings'?settingsHTML():'';
  if($('.modal-scroll'))$('.modal-scroll').scrollTop=oldScroll;
  document.body.dataset.modal=String(!!modal);
  updateInteractionState();

function updateInteractionState(){

function chips(field,options){return`<div class="chips">${options.map(x=>`<button class="chip ${field==='location'?draft.location===x? 'selected':'':draft[field].includes(x)?'selected':''}" data-action="chip" data-field="${field}" data-value="${x}" aria-pressed="${field==='location'?draft.location===x:draft[field].includes(x)}">${x}</button>`).join('')}</div>`}
const health=`<p class="health-note">${icon('info')}<span>突然出现的剧烈头痛，或伴随无力、言语或视力异常，请及时寻求医疗帮助。</span></p>`;
function editorHTML(){let completed=!!draft.endedAt;let body=`<section class="field-section"><div class="section-title"><h3>疼痛有多强</h3><span class="caption">必填</span></div><div class="intensity-value"><span class="intensity-number">${draft.intensity||'—'}</span><span class="number-unit">/ 10</span><span class="intensity-description">${draft.intensity?draft.intensity<=3?'轻度 · 可以正常活动':draft.intensity<=6?'中度 · 影响日常活动':'重度 · 难以正常活动':'请选择强度'}</span></div><div class="intensity-buttons">${Array.from({length:10},(_,i)=>`<button class="intensity-button ${draft.intensity===i+1?'selected':''}" data-action="intensity" data-value="${i+1}" aria-label="疼痛强度 ${i+1} / 10" aria-pressed="${draft.intensity===i+1}">${i+1}</button>`).join('')}</div><div class="range-labels"><span>1 轻微</span><span>10 最强</span></div></section><section class="field-section"><div class="section-title"><h3>哪里不舒服</h3><span class="caption">选填</span></div>${chips('location',['左侧','右侧','双侧','额头','后脑','整个头部'])}</section><div class="card time-card"><label class="form-row"><span>开始时间</span><input class="date-input" type="datetime-local" name="startedAt" value="${localDate(new Date(draft.startedAt))}" max="${localDate(new Date())}" aria-label="开始时间"></label><label class="form-row"><span>仍在头痛</span><input class="switch" type="checkbox" name="ongoing" aria-label="仍在头痛" ${completed?'':'checked'}></label>${completed?`<label class="form-row"><span>结束时间</span><input class="date-input" type="datetime-local" name="endedAt" value="${localDate(new Date(draft.endedAt))}" max="${localDate(new Date())}" aria-label="结束时间"></label>`:''}</div><button class="expand-button" data-action="expand" aria-expanded="${expanded}">${icon('text')}<span>${expanded?'收起更多细节':'补充更多细节'}</span><span class="caption">选填</span>${icon('down')}</button>${expanded?`<section class="field-section"><div class="section-title"><h3>伴随症状</h3><span class="caption">可多选</span></div>${chips('symptoms',['畏光','怕声音','恶心','眩晕','视觉异常','其他'])}</section><section class="field-section"><div class="section-title"><h3>可能相关因素</h3><span class="caption">可多选</span></div>${chips('factors',['睡眠不足','压力','久看屏幕','饮食变化','生理期','不确定'])}</section><section class="field-section"><div class="section-title"><h3>尝试过的缓解方式</h3><span class="caption">可多选</span></div>${chips('relief',['休息','喝水','冷敷','用药','其他'])}</section><section class="field-section"><div class="section-title"><h3>用药记录</h3><span class="caption">选填</span></div><textarea class="notes medication" name="medication" maxlength="200" aria-label="用药记录" placeholder="药名、剂量及服用时间">${esc(draft.medication)}</textarea><p class="caption">仅记录已使用的药物，不提供用药建议。</p></section><section class="field-section"><div class="section-title"><h3>想补充的话</h3><span class="caption" id="note-counter">${[...draft.notes].length} / 500</span></div><textarea class="notes" name="notes" maxlength="1000" aria-label="备注" placeholder="当时在做什么，有什么感受……">${esc(draft.notes)}</textarea></section>`:''}${health}`;return modalShell(editingExisting?'编辑这次记录':'记录一次头痛','先记下来，细节可以以后补充。',body,`${error?`<div class="field-error" role="alert">${esc(error)}</div>`:''}<button class="primary" data-action="save" ${!draft.intensity||locked?'disabled':''}>${icon('check')}${editingExisting?'保存修改':'保存这次记录'}</button>`)}
function detailHTML(){let r=records.find(r=>r.id===draft?.id);if(!r)return'';let body=`<section class="card detail-hero"><div class="caption">${r.endedAt?'已结束':'进行中'}</div><div class="intensity-value" style="margin:13px 0 0"><span class="intensity-number">${r.intensity}</span><span class="number-unit">/ 10</span><span class="intensity-description" style="color:${color(r.intensity)}">${label(r.intensity)}</span></div><h2>${esc(title(r))}</h2></section><section class="card"><div class="detail-time"><span>开始</span><span>${fmtFull(r.startedAt)}</span></div><div class="detail-time"><span>结束</span><span>${r.endedAt?fmtFull(r.endedAt):'仍在头痛'}</span></div><div class="detail-time"><span>时长</span><span>${duration(r)}</span></div></section>${[['伴随症状',r.symptoms.join('、')],['可能相关因素',r.factors.join('、')],['尝试过的缓解方式',r.relief.join('、')],['用药记录',r.medication],['备注',r.notes]].filter(x=>x[1]).map(([k,v])=>`<section class="card detail-block"><h3>${k}</h3><p>${esc(v)}</p></section>`).join('')}${error?`<div class="field-error" role="alert">${esc(error)}</div>`:''}<div style="margin-top:24px">${!r.endedAt?`<button class="primary" data-action="finish" data-id="${esc(r.id)}">${icon('check')}现在结束这次头痛</button>`:''}<button class="action-secondary" data-action="edit" data-id="${esc(r.id)}">${icon('edit')}编辑这条记录</button><button class="danger" data-action="delete" data-id="${esc(r.id)}">删除这条记录</button></div>`;return modalShell('记录详情',`${fmtDate(r.startedAt)} · ${r.isDemo?'虚构演示记录':'只属于你的记录'}`,body)}
function settingsHTML(){return modalShell('记录与隐私','你的记录，由你保管。',`<div class="settings"><section class="card settings-hero">${icon('lock')}<h2>你的记录，<br>由你保管。</h2><p class="settings-copy">无需账号，不上传记录。这个原型的数据仅保存在当前浏览器；清除浏览器数据或更换设备后不会自动恢复。重要记录请先导出。</p></section><section class="card"><h3>导出记录</h3><p class="settings-copy">导出文件含有你的健康记录，请自行选择保存或分享的对象。</p><button class="action-secondary" data-action="export" ${!records.length?'disabled':''}>${icon('export')}导出全部记录 CSV</button></section><section class="card"><h3>关于健康记录</h3><p class="settings-copy">Headly 帮你记录与回顾，不提供诊断或用药建议。强度分组用于浏览，不是医学分级。</p>${health}</section>${!records.length?'<button class="action-secondary" data-action="demo">加载虚构演示记录</button>':''}<button class="danger" data-action="clear" ${!records.length||locked?'disabled':''}>清除所有记录</button>${error?`<div class="field-error" role="alert">${esc(error)}</div>`:''}<div class="version">Headly 轻记 · 产品原型 1.0</div></div>`)}
function save(){try{refreshRecords();let now=new Date();if(editingExisting)requireUnchanged(original);if(!Number.isInteger(draft.intensity)||draft.intensity<1||draft.intensity>10)throw Error('请选择疼痛强度。');if(!Number.isFinite(Date.parse(draft.startedAt)))throw Error('请选择有效的开始时间。');if(new Date(draft.startedAt)>now)throw Error('开始时间不能晚于现在。');if(draft.endedAt&&(!Number.isFinite(Date.parse(draft.endedAt))||new Date(draft.endedAt)<=new Date(draft.startedAt)||new Date(draft.endedAt)>now))throw Error('结束时间需要晚于开始时间，且不能晚于现在。');if(!draft.endedAt&&records.some(r=>!r.endedAt&&r.id!==draft.id))throw Error('已有一条进行中的记录，请先结束它，或将这次记录设为已结束。');if([...draft.notes].length>500||[...draft.medication].length>200)throw Error('备注最多 500 字，用药记录最多 200 字。');draft.updatedAt=now.toISOString();persist(records.filter(r=>r.id!==draft.id).concat(clone(draft)));closeModal(true);toast('记录已保存')}catch(e){error=e.message;renderOverlay()}}
function ask(heading,copy,yes,action,no='取消',destructive=false){confirmation={heading,copy,yes,action,no,destructive};$('#confirmation-root').innerHTML=`<div class="confirm-layer"><section class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-heading"><h2 id="confirm-heading">${esc(heading)}</h2><p>${esc(copy)}</p><div class="confirm-actions"><button class="${destructive?'destructive':''}" data-action="confirm-yes">${esc(yes)}</button><button class="cancel" data-action="confirm-no">${esc(no)}</button></div></section></div>`;updateInteractionState();setTimeout(()=>$('[data-action="confirm-no"]')?.focus(),0)}
function clearConfirmation(){confirmation=null;$('#confirmation-root').innerHTML='';updateInteractionState()}
function demo(){if(locked){toast('本地记录无法读取，已停止写入');return}if(records.length){toast('请先清除现有记录，再加载演示数据');return}ask('加载演示记录？','将加入 5 条虚构记录，帮助你体验回顾页面。不会连接任何账号。','加载演示数据',()=>{let base=dayStart(new Date()),days=[-1,-4,-7,-11,-17],scores=[4,6,3,5,2],positions=['左侧','额头','右侧','双侧','后脑'];try{refreshRecords();if(records.length)throw Error('已有记录，无法加载演示数据。请关闭后重新确认。');let next=days.map((d,i)=>{let start=addDays(base,d);start.setHours(14);return{id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+i,startedAt:start.toISOString(),endedAt:new Date(+start+[90,150,45,120,60][i]*60000).toISOString(),intensity:scores[i],location:positions[i],symptoms:i===1?['畏光']:[],factors:i%2?['压力','久看屏幕']:['睡眠不足'],relief:['休息'],medication:'',notes:i===0?'午后工作时开始，休息后缓解。':'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),isDemo:true}});persist(next);closeModal(true);toast('已加载虚构演示记录')}catch(e){toast(e.message)}})}
function clearRecords(){
  const snapshot=JSON.stringify(records);
  ask('清除全部记录？',`即将删除 ${records.length} 条记录，无法撤销。重要记录请先导出。`,'清除全部记录',()=>{
    try{refreshRecords();if(JSON.stringify(records)!==snapshot)throw Error('记录已在其他窗口更新，请重新确认清除。');persist([]);closeModal(true);toast('记录已清除')}
    catch(e){error=e.message;renderOverlay();toast(e.message)}
  },'取消',true);
}
function exportCSV(){const cell=v=>{let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};let rows=[['ID','开始时间','结束时间','状态','疼痛强度','部位','症状','可能相关因素','缓解方式','用药记录','备注']].concat(records.map(r=>[r.id,r.startedAt,r.endedAt||'',r.endedAt?'已结束':'进行中',r.intensity,r.location,r.symptoms.join('；'),r.factors.join('；'),r.relief.join('；'),r.medication,r.notes]));let blob=new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Headly-记录.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('记录已导出')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let a=b.dataset.action,id=b.dataset.id;if(confirmation&&!a.startsWith('confirm-'))return;
if(a==='confirm-no'){clearConfirmation();return}if(a==='confirm-yes'){let act=confirmation.action;clearConfirmation();act();return}
if(a==='today'||a==='review'||a==='scene-today'||a==='scene-review'){if(isDirty()){ask('放弃这次修改？','切换页面后，尚未保存的输入会被丢弃。','放弃并切换',()=>{tab=a.includes('today')?'today':'review';closeModal(true);$('#main-scroll').scrollTop=0},'继续编辑',true);return}tab=a.includes('today')?'today':'review';closeModal(true);$('#main-scroll').scrollTop=0}
else if(a==='new'||a==='scene-record')newRecord();else if(a==='backfill')newRecord(selectedDay);else if(a==='close')closeModal();else if(a==='settings'){error='';openModal('settings')}
else if(a==='detail'){draft=clone(records.find(r=>r.id===id));error='';openModal('detail')}
else if(a==='edit')editRecord(id);else if(a==='intensity'){draft.intensity=Number(b.dataset.value);renderOverlay()}
else if(a==='chip'){let f=b.dataset.field,v=b.dataset.value;if(f==='location')draft.location=draft.location===v?'未选择':v;else draft[f]=draft[f].includes(v)?draft[f].filter(x=>x!==v):draft[f].concat(v);renderOverlay()}
else if(a==='expand'){expanded=!expanded;renderOverlay()}else if(a==='save')save()
else if(a==='finish'){try{let expected=records.find(r=>r.id===id);refreshRecords();let r=clone(requireUnchanged(expected));r.endedAt=new Date().toISOString();r.updatedAt=r.endedAt;if(new Date(r.endedAt)<=new Date(r.startedAt))throw Error('结束时间需要晚于开始时间，请稍后再试。');persist(records.map(x=>x.id===id?r:x));closeModal(true);toast('已结束，辛苦了。')}catch(e){error=e.message;renderOverlay()}}
else if(a==='delete'){const expected=records.find(r=>r.id===id);ask('删除这条记录？','这条记录将被永久删除，统计会同步更新。','删除记录',()=>{try{refreshRecords();requireUnchanged(expected);persist(records.filter(r=>r.id!==id));closeModal(true);toast('记录已删除')}catch(e){error=e.message;renderOverlay()}},'取消',true)}
else if(a==='prev-month'||a==='next-month'){month=new Date(month.getFullYear(),month.getMonth()+(a==='prev-month'?-1:1),1);selectedDay=null;render()}
else if(a==='day'){selectedDay=selectedDay===b.dataset.day?null:b.dataset.day;render()}else if(a==='all-days'){selectedDay=null;render()}
else if(a==='export')exportCSV();else if(a==='clear'||a==='empty'){if(records.length)clearRecords();else{closeModal(true);tab='today';render();toast('当前已经是空状态')}}else if(a==='demo')demo();
});
document.addEventListener('input',e=>{if(modal!=='editor')return;let n=e.target.name;if(n==='notes'||n==='medication'){draft[n]=e.target.value;if(n==='notes'&&$('#note-counter'))$('#note-counter').textContent=`${[...draft.notes].length} / 500`}});
document.addEventListener('change',e=>{if(modal!=='editor')return;let n=e.target.name;if(n==='ongoing'){draft.endedAt=e.target.checked?null:new Date().toISOString();renderOverlay()}else if(n==='startedAt'||n==='endedAt'){let d=new Date(e.target.value);if(Number.isFinite(+d))draft[n]=d.toISOString();else{error='请选择有效的日期和时间。';renderOverlay()}}});
document.addEventListener('keydown',e=>{let container=confirmation?$('.confirm-box'):modal?$('.modal'):null;if(!container)return;if(e.key==='Escape'){e.preventDefault();if(confirmation)clearConfirmation();else closeModal()}if(e.key==='Tab'){let items=[...container.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,a[href]')].filter(x=>x.offsetParent!==null),first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){last?.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first?.focus();e.preventDefault()}}});
window.addEventListener('storage',e=>{if(e.key!==KEY&&e.key!==null)return;try{records=readRecords(localStorage.getItem(KEY));locked=false;loadError='';render();toast('记录已从另一个窗口更新')}catch(err){locked=true;loadError='另一个窗口的数据无法读取，已停止写入。';render()}});
render();
})();
</script>
</body>
</html>
